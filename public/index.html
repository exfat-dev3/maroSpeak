<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>maroSpeak</title>
  <meta name="theme-color" content="#6478e8">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app">

  <header>
    <div class="logo">m</div>
    <div class="brand">
      <h1>maroSpeak</h1>
      <p>Text to Speech Studio</p>
    </div>
    <span class="version">v1.2</span>
  </header>

  <main>
    <div class="intro">
      <h2>テキストを音声に変換</h2>
      <p>文章を入力して、音声を生成しよう。</p>
    </div>

    <section class="panel">

      <label for="textInput">テキスト</label>

      <textarea
        id="textInput"
        maxlength="2000"
        placeholder="ここに読み上げたい文章を入力..."
      ></textarea>

      <div class="text-meta">
        <span id="charCount">0 / 2000</span>
        <button id="clearBtn" class="text-btn">クリア</button>
      </div>

      <div class="settings">
        <div class="setting">
          <label for="language">言語</label>
          <select id="language">
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="ko">韓国語</option>
            <option value="zh-cn">中国語</option>
          </select>
        </div>

        <div class="setting">
          <label for="quality">音質</label>
          <select id="quality">
            <option value="normal">標準</option>
            <option value="smooth">くっきり</option>
            <option value="clear">クリア</option>
          </select>
        </div>
      </div>

      <div class="quality-info" id="qualityInfo">
        <span class="info-icon">ⓘ</span>
        <span id="qualityDescription">
          Google TTSの元音声をそのまま再生します。
        </span>
      </div>

      <button id="generateBtn" class="generate-btn">
        <span id="generateIcon">♫</span>
        <span id="generateText">音声を生成</span>
      </button>

      <div id="status" class="status"></div>

    </section>

    <section id="playerPanel" class="panel player-panel hidden">

      <div class="player-heading">
        <div class="music-icon">♫</div>
        <div>
          <h3>生成された音声</h3>
          <p id="audioInfo">再生準備完了</p>
        </div>
      </div>

      <audio id="audioPlayer" controls></audio>

      <div class="player-actions">
        <button id="downloadBtn" class="download-btn">
          ↓ 音声をダウンロード
        </button>
      </div>

    </section>

    <div class="footer-note">
      <span>Powered by Google TTS</span>
      <span>maroSpeak</span>
    </div>
  </main>

</div>

<script src="/app.js"></script>
</body>
</html>
